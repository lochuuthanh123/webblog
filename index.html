
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loc Huu Thanh | Technical Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --true-black: #05070c;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.16);
      --accent-blue: #5eb4ff;
      --accent-amber: #f8c27a;
      --status-green: #22c55e;
      --status-red: #ef4444;
    }
    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(140% 60% at 20% 20%, rgba(94,180,255,0.12), transparent),
        radial-gradient(120% 70% at 80% 10%, rgba(248,194,122,0.12), transparent),
        var(--true-black);
      color: #f5f7fb;
      overflow-x: hidden;
    }

    .bio-text {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: 1.125rem;
      line-height: 1.9;
      color: rgba(255, 255, 255, 0.82);
      letter-spacing: 0.04em;
      text-shadow: 0 4px 25px rgba(59, 130, 246, 0.25);
    }

    .process-copy {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      letter-spacing: 0.04em;
    }

    .hero-name {
      font-family: 'Rajdhani', 'Space Grotesk', 'Inter', sans-serif;
      letter-spacing: 0.08em;
      line-height: 0.9;
      text-transform: uppercase;
      font-weight: 700;
      text-rendering: geometricPrecision;
      color: #ffffff;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.7);
    }
    
    /* Technical Background Grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 0);
      background-size: 32px 32px;
      background-position: center;
      z-index: -1;
      pointer-events: none;
      opacity: 0.7;
    }

    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
    
    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 18px 60px 0 rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(94,180,255,0.08);
    }
    
    .inner-highlight {
      position: relative;
    }
    
    .inner-highlight::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(94,180,255,0.10) 45%, transparent 70%);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }

    .modal-blur {
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      background: rgba(0, 0, 0, 0.9);
    }

    /* Disable hover brightening; force text to stay white */
    [class*="text-white/"] {
      color: #ffffff !important;
      opacity: 1 !important;
      transition: none;
    }
    [class*="text-white/"]:hover {
      color: #ffffff !important;
      opacity: 1 !important;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    .scan-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
      box-shadow: 0 0 15px rgba(255,255,255,0.3);
      animation: scan 3s linear infinite;
      z-index: 10;
    }

    /* Dynamic Status Animations - Smoothed Transition */
    @keyframes status-color-cycle {
      0%, 100% { background-color: var(--status-green); box-shadow: 0 0 15px var(--status-green); }
      50% { background-color: var(--status-red); box-shadow: 0 0 15px var(--status-red); }
    }

    @keyframes status-text-cycle {
      0%, 100% { 
        color: var(--status-green); 
        text-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        opacity: 1;
      }
      50% { 
        color: var(--status-red); 
        text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        opacity: 0.8;
      }
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.5); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    .status-dot-dynamic {
      animation: status-color-cycle 4s ease-in-out infinite;
    }

    .status-text-dynamic {
      animation: status-text-cycle 4s ease-in-out infinite;
    }

    .pulse-dot::before {
      content: '';
      position: absolute;
      width: 400%;
      height: 400%;
      top: -150%;
      left: -150%;
      border-radius: 50%;
      animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite, status-color-cycle 4s ease-in-out infinite;
    }
    
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .radar-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 2s ease-out forwards;
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    /* Mobile tuning */
    @media (max-width: 640px) {
      .bio-text { font-size: 1rem; line-height: 1.7; letter-spacing: 0.02em; }
      .process-copy { letter-spacing: 0.02em; }
      .bg-grid { opacity: 0.4; background-size: 32px 32px; }
      body { font-size: 15px; }
    }
  </style>
